[build]
  publish = "ui"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # sites/** → site configs; core/** + _bg_impl.mjs → needed by the background function
  # at runtime (the CJS shim loads them via dynamic import, so esbuild doesn't inline them).
  included_files = ["sites/**", "core/**", "netlify/functions/_blobs.mjs", "netlify/functions/_bg_impl.mjs"]
  # _bg_impl.mjs is loaded at runtime (not bundled), so ALL packages it uses
  # transitively must be deployed as real node_modules, not inlined by esbuild.
  external_node_modules = ["@sparticuz/chromium", "playwright-core", "@netlify/blobs", "archiver"]

# Extra memory + max timeout for the Playwright background worker
[functions.api-run-background]
  memory  = 3008
  timeout = 900

# ---------------------------------------------------------------------------
# API routes → functions
# ---------------------------------------------------------------------------

[[redirects]]
  from   = "/site-image/:siteId"
  to     = "/.netlify/functions/api-site-image?siteId=:siteId"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/sites"
  to     = "/.netlify/functions/api-sites"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/config/:siteId"
  to     = "/.netlify/functions/api-config?siteId=:siteId"
  status = 200
  force  = true

# Background function — Netlify auto-returns 202 immediately, function runs up to 15 min
[[redirects]]
  from   = "/api/run"
  to     = "/.netlify/functions/api-run-background"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/status/:jobId"
  to     = "/.netlify/functions/api-status?jobId=:jobId"
  status = 200
  force  = true

[[redirects]]
  from   = "/api/thumbnail/:jobId/:index"
  to     = "/.netlify/functions/api-thumbnail?jobId=:jobId&index=:index"
  status = 200
  force  = true


# /run serves the run page (mirrors Express GET /run)
[[redirects]]
  from   = "/run"
  to     = "/run.html"
  status = 200
