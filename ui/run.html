<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiteSnap · Configure capture</title>
  <style>
    :root {
      --navy: #102b3a;
      --navy-2: #1b4254;
      --lime: #72d44b;
      --lime-dark: #3f9d2a;
      --ink: #172b36;
      --muted: #6d7f88;
      --line: #dce5e7;
      --paper: #f3f7f6;
      --white: #fff;
      --blue: #3b82f6;
      --amber: #c47b0a;
      --danger: #b43d3d;
      --sidebar: 270px;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; }
    body { margin: 0; color: var(--ink); background: var(--paper); font: 14px/1.45 Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    button, input, select { font: inherit; }
    button { color: inherit; }
    .topbar { position: sticky; top: 0; z-index: 50; height: 68px; display: flex; align-items: center; gap: 16px; padding: 0 24px; color: white; background: rgba(16,43,58,.97); border-bottom: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(18px); }
    .brand { display: flex; align-items: center; gap: 10px; color: white; text-decoration: none; }
    .brand-mark { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--lime); color: var(--navy); }
    .brand strong { letter-spacing: -.03em; }
    .top-divider { width: 1px; height: 24px; background: rgba(255,255,255,.18); }
    .project-title { min-width: 0; flex: 1; }
    .project-title strong { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .project-title span { display: block; color: #9fb4bd; font-size: 11px; }
    .capture-button { border: 0; border-radius: 11px; padding: 10px 17px; background: var(--lime); color: var(--navy); font-weight: 800; cursor: pointer; box-shadow: 0 8px 22px rgba(79,177,44,.18); }
    .capture-button:hover { background: #86e25f; }
    .capture-button:disabled { opacity: .45; cursor: not-allowed; }
    .app { display: grid; grid-template-columns: var(--sidebar) minmax(0,1fr); min-height: calc(100vh - 68px); }
    .sidebar { position: sticky; top: 68px; height: calc(100vh - 68px); overflow: auto; border-right: 1px solid var(--line); background: #eef4f2; padding: 18px 14px; }
    .preview { width: 100%; height: 118px; object-fit: cover; object-position: top; display: block; border-radius: 12px; border: 1px solid #cfdbde; background: #dfe9e6; }
    .target-link { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 9px 4px 22px; color: var(--muted); text-decoration: none; font-size: 11px; }
    .target-link:hover { color: var(--ink); }
    .sidebar-label { margin: 0 8px 8px; color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    .page-nav { display: grid; gap: 5px; }
    .page-row { display: flex; align-items: center; gap: 7px; border-radius: 10px; padding: 4px 5px 4px 3px; border: 1px solid transparent; }
    .page-row.active { background: var(--white); border-color: var(--line); box-shadow: 0 5px 16px rgba(16,43,58,.06); }
    .page-row.disabled { opacity: .48; }
    .page-button { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 7px; cursor: pointer; }
    .page-button strong, .page-button small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .page-button strong { font-size: 12px; }
    .page-button small { color: var(--muted); font-size: 10px; margin-top: 1px; }
    .workspace { min-width: 0; }
    .controls { position: sticky; top: 68px; z-index: 35; display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding: 15px 24px; background: rgba(243,247,246,.94); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
    .preset-row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .preset { border: 1px solid #ccd9dc; border-radius: 999px; background: var(--white); padding: 7px 11px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .preset:hover { border-color: #9eb4ba; }
    .preset.primary { color: var(--navy); background: #e4f7dd; border-color: #bde5ae; }
    .search { width: min(220px, 28vw); border: 1px solid #ccd9dc; border-radius: 999px; background: var(--white); padding: 7px 12px; outline: none; font-size: 12px; }
    .search:focus { border-color: var(--lime-dark); box-shadow: 0 0 0 3px rgba(63,157,42,.1); }
    .device-row { display: flex; gap: 8px; }
    .device { display: flex; align-items: center; gap: 8px; border: 1px solid #ccd9dc; border-radius: 11px; background: var(--white); padding: 6px 9px; }
    .device.disabled { opacity: .5; }
    .device-name { font-size: 11px; font-weight: 800; }
    .mini-input { width: 54px; padding: 4px 5px; border: 1px solid var(--line); border-radius: 6px; text-align: center; color: var(--ink); font-size: 11px; }
    .mini-select { padding: 4px 22px 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: white; font-size: 11px; }
    .content { padding: 28px 30px 80px; max-width: 1240px; margin: 0 auto; }
    .page-head { display: flex; align-items: start; gap: 18px; margin-bottom: 24px; }
    .page-head-copy { flex: 1; min-width: 0; }
    .page-head h1 { margin: 0 0 5px; font: 500 30px/1.15 Georgia, "Times New Roman", serif; letter-spacing: -.035em; }
    .page-head p { margin: 0; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; word-break: break-all; }
    .page-switch { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .group { margin-bottom: 26px; }
    .group-head { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .group-head h2 { margin: 0; font-size: 11px; letter-spacing: .13em; text-transform: uppercase; }
    .group-line { flex: 1; height: 1px; background: var(--line); }
    .group-toggle { border: 0; background: none; color: var(--muted); font-size: 10px; cursor: pointer; }
    .card-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }
    .step-card { border: 1px solid var(--line); border-radius: 15px; background: var(--white); padding: 16px; box-shadow: 0 4px 16px rgba(16,43,58,.025); transition: opacity .15s, border-color .15s; }
    .step-card.off { opacity: .52; box-shadow: none; }
    .step-card:hover { border-color: #c2d1d5; }
    .step-head { display: flex; align-items: start; gap: 10px; }
    .step-copy { flex: 1; min-width: 0; }
    .step-copy h3 { margin: 1px 0 3px; font-size: 13px; }
    .step-copy p { margin: 0; color: var(--muted); font-size: 11px; min-height: 32px; }
    .mode { border: 1px solid #d3dfe1; border-radius: 8px; background: #f8fbfa; padding: 5px 24px 5px 7px; font-size: 10px; font-weight: 800; color: var(--navy); }
    .step-options { display: grid; gap: 9px; border-top: 1px solid #edf1f2; margin-top: 13px; padding-top: 12px; }
    .option-row { display: flex; align-items: center; gap: 8px; }
    .option-label { width: 88px; flex-shrink: 0; color: var(--muted); font-size: 10px; font-weight: 700; }
    .option-input { flex: 1; min-width: 0; border: 1px solid #d4dfe1; border-radius: 8px; padding: 7px 9px; background: white; color: var(--ink); font-size: 11px; outline: none; }
    .option-input:focus { border-color: var(--lime-dark); box-shadow: 0 0 0 3px rgba(63,157,42,.09); }
    .dims { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; }
    .dims .mini-input { width: 58px; }
    .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 11px; }
    .check-label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 10px; cursor: pointer; }
    input[type="checkbox"] { accent-color: var(--lime-dark); }
    .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 7px; background: #edf3f5; color: var(--muted); font-size: 9px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
    .toggle { position: relative; width: 34px; height: 19px; flex-shrink: 0; }
    .toggle input { position: absolute; opacity: 0; }
    .toggle span { position: absolute; inset: 0; border-radius: 999px; background: #c8d2d5; cursor: pointer; transition: .18s; }
    .toggle span::after { content: ''; position: absolute; width: 13px; height: 13px; top: 3px; left: 3px; border-radius: 50%; background: white; box-shadow: 0 1px 3px rgba(0,0,0,.22); transition: .18s; }
    .toggle input:checked + span { background: var(--lime-dark); }
    .toggle input:checked + span::after { transform: translateX(15px); }
    .empty { padding: 48px; border: 1px dashed #c7d5d8; border-radius: 15px; text-align: center; color: var(--muted); background: rgba(255,255,255,.45); }
    .skeleton { height: 140px; border-radius: 15px; background: linear-gradient(100deg,#e5ecea 20%,#f5f8f7 45%,#e5ecea 70%); background-size: 220% 100%; animation: shimmer 1.3s infinite; }
    @keyframes shimmer { to { background-position: -220% 0; } }
    .modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px; background: rgba(8,28,38,.72); backdrop-filter: blur(7px); }
    .modal.hidden { display: none; }
    .run-panel { width: min(720px,100%); max-height: min(780px,calc(100vh - 48px)); display: flex; flex-direction: column; overflow: hidden; border-radius: 20px; background: var(--white); box-shadow: 0 28px 100px rgba(0,0,0,.35); }
    .run-head { display: flex; align-items: center; gap: 13px; padding: 20px 22px; color: white; background: var(--navy); }
    .spinner { width: 27px; height: 27px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); border-top-color: var(--lime); animation: spin .75s linear infinite; }
    .spinner.hidden { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .run-copy { flex: 1; min-width: 0; }
    .run-copy strong, .run-copy span { display: block; }
    .run-copy span { color: #afc2ca; font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .progress { height: 5px; background: #e8eeec; }
    .progress > div { height: 100%; width: 0; background: var(--lime); transition: width .25s; }
    .run-meta { display: flex; justify-content: space-between; padding: 10px 20px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 10px; }
    .captures { min-height: 160px; overflow: auto; padding: 12px; display: grid; gap: 8px; }
    .capture-row { display: grid; grid-template-columns: 132px 1fr; gap: 12px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 11px; }
    .capture-row img { width: 132px; height: 76px; border-radius: 7px; object-fit: cover; object-position: top; background: #e9efed; }
    .capture-row strong { font-size: 11px; }
    .run-error { display: none; margin: 14px 18px 0; padding: 10px 12px; border: 1px solid #ecc7c7; border-radius: 9px; color: var(--danger); background: #fff5f5; font-size: 12px; }
    .run-actions { display: flex; gap: 9px; padding: 14px 18px 18px; border-top: 1px solid var(--line); }
    .run-action { display: none; flex: 1; border: 0; border-radius: 10px; padding: 10px 13px; text-align: center; text-decoration: none; font-weight: 800; cursor: pointer; }
    .run-action.download { background: var(--lime); color: var(--navy); }
    .run-action.close { background: #edf2f1; color: var(--ink); }
    @media (max-width: 1040px) { .controls { grid-template-columns: 1fr; } .device-row { justify-content: flex-start; } }
    @media (max-width: 820px) { :root { --sidebar: 0px; } .sidebar { display: none; } .card-grid { grid-template-columns: 1fr; } .content { padding: 22px 16px 70px; } .controls { position: static; padding: 13px 16px; } .topbar { padding: 0 15px; } .project-title span { display: none; } .device { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="13" rx="2" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="11.5" r="3" fill="currentColor"/></svg></span>
      <strong>SiteSnap</strong>
    </a>
    <span class="top-divider"></span>
    <div class="project-title"><strong id="project-name">Loading…</strong><span id="project-note">Local capture configuration</span></div>
    <button class="capture-button" id="capture-button" disabled>Capture · 0</button>
  </header>

  <div class="app">
    <aside class="sidebar" id="sidebar"><div class="skeleton"></div></aside>
    <section class="workspace">
      <div class="controls">
        <div class="preset-row">
          <button class="preset primary" data-preset="recommended">Recommended</button>
          <button class="preset" data-preset="essential">Essential only</button>
          <button class="preset" data-preset="all">All states</button>
          <button class="preset" data-preset="clear">Clear</button>
          <input class="search" id="search" type="search" placeholder="Filter capture states…">
        </div>
        <div class="device-row" id="device-row"></div>
      </div>
      <main class="content" id="content"><div class="skeleton"></div><div class="skeleton" style="margin-top:12px"></div></main>
    </section>
  </div>

  <div class="modal hidden" id="run-modal" role="dialog" aria-modal="true" aria-labelledby="run-title">
    <section class="run-panel">
      <div class="run-head"><div class="spinner" id="spinner"></div><div class="run-copy"><strong id="run-title">Capturing Nuveen</strong><span id="run-status">Starting Chromium…</span></div></div>
      <div class="progress"><div id="progress-fill"></div></div>
      <div class="run-meta"><span id="progress-label">0 of 0</span><span>Desktop and mobile run in parallel</span></div>
      <div class="run-error" id="run-error"></div>
      <div class="captures" id="captures"><div class="empty">Screenshots will appear here as they complete.</div></div>
      <div class="run-actions"><a class="run-action download" id="download" href="#">Download ZIP</a><button class="run-action close" id="close-modal">Close</button></div>
    </section>
  </div>

  <script>
    const ESSENTIAL_IDS = new Set([
      'hero-nhmrx', 'performance-quarterly', 'tey-sample',
      'distributions-since-inception', 'characteristics-maturity'
    ]);

    const state = {
      siteId: '', site: null, config: null, defaults: null,
      activePage: 0, query: '', pollTimer: null, jobId: null, rendered: 0, running: false,
    };

    async function boot() {
      state.siteId = new URLSearchParams(location.search).get('site') || '';
      if (!state.siteId) { location.href = '/'; return; }
      try {
        const [configResponse, sitesResponse] = await Promise.all([
          fetch(`/api/config/${encodeURIComponent(state.siteId)}`), fetch('/api/sites')
        ]);
        const config = await configResponse.json();
        const sites = await sitesResponse.json();
        if (!configResponse.ok) throw new Error(config.error || `HTTP ${configResponse.status}`);
        state.site = sites.find(site => site.id === state.siteId) || { name: state.siteId };
        state.config = clone(config);
        state.defaults = clone(config);
        document.getElementById('project-name').textContent = state.site.name;
        document.getElementById('project-note').textContent = state.site.description || 'Local capture configuration';
        bindStaticEvents();
        renderAll();
        document.getElementById('capture-button').disabled = false;
      } catch (error) {
        document.getElementById('content').innerHTML = `<div class="empty">Unable to load configuration: ${escapeHtml(error.message)}</div>`;
      }
    }

    function bindStaticEvents() {
      document.querySelectorAll('[data-preset]').forEach(button => button.addEventListener('click', () => applyPreset(button.dataset.preset)));
      document.getElementById('search').addEventListener('input', event => { state.query = event.target.value.trim().toLowerCase(); renderPage(); });
      document.getElementById('capture-button').addEventListener('click', startCapture);
      document.getElementById('close-modal').addEventListener('click', closeModal);
      document.getElementById('run-modal').addEventListener('click', event => { if (event.target === event.currentTarget && !state.pollTimer) closeModal(); });
      window.addEventListener('beforeunload', stopPoll);
    }

    function renderAll() {
      renderDevices();
      renderSidebar();
      renderPage();
      updateSummary();
    }

    function renderDevices() {
      const row = document.getElementById('device-row');
      row.innerHTML = '';
      ['desktop', 'mobile'].forEach(name => {
        const device = state.config.devices[name];
        const card = node('div', { class: `device${device.enabled === false ? ' disabled' : ''}` });
        const enabled = node('input', { type: 'checkbox' }); enabled.checked = device.enabled !== false;
        enabled.addEventListener('change', () => {
          const other = name === 'desktop' ? 'mobile' : 'desktop';
          if (!enabled.checked && state.config.devices[other].enabled === false) { enabled.checked = true; return; }
          device.enabled = enabled.checked; renderAll();
        });
        card.append(enabled, node('span', { class: 'device-name', text: name === 'desktop' ? 'Desktop' : 'Mobile' }));
        const width = miniNumber(device.viewport.width, value => { device.viewport.width = value; updateSummary(); });
        const height = miniNumber(device.viewport.height, value => { device.viewport.height = value; updateSummary(); });
        const scale = node('select', { class: 'mini-select' });
        [['1','1×'],['2','2×']].forEach(([value,label]) => { const option = node('option', { value, text: label }); option.selected = Number(device.deviceScaleFactor) === Number(value); scale.appendChild(option); });
        scale.addEventListener('change', () => { device.deviceScaleFactor = Number(scale.value); });
        card.append(width, node('span', { text: '×' }), height, scale);
        row.appendChild(card);
      });
    }

    function renderSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.innerHTML = '';
      if (state.site.imageUrl) sidebar.appendChild(node('img', { class: 'preview', src: state.site.imageUrl, alt: `${state.site.name} preview` }));
      if (state.site.primaryUrl) sidebar.appendChild(node('a', { class: 'target-link', href: state.site.primaryUrl, target: '_blank' }, 'Open live target', '↗'));
      sidebar.appendChild(node('div', { class: 'sidebar-label', text: 'Capture pages' }));
      const nav = node('nav', { class: 'page-nav' });
      state.config.pages.forEach((page, index) => {
        const row = node('div', { class: `page-row${index === state.activePage ? ' active' : ''}${page.enabled === false ? ' disabled' : ''}` });
        const button = node('button', { class: 'page-button' }, node('strong', { text: page.label }), node('small', { text: `${enabledOnPage(page)} selected` }));
        button.addEventListener('click', () => { state.activePage = index; renderSidebar(); renderPage(); });
        const toggle = toggleControl(page.enabled !== false, checked => { page.enabled = checked; renderAll(); });
        row.append(button, toggle); nav.appendChild(row);
      });
      sidebar.appendChild(nav);
    }

    function renderPage() {
      const content = document.getElementById('content');
      const page = state.config.pages[state.activePage];
      if (!page) { content.innerHTML = '<div class="empty">No page selected.</div>'; return; }
      content.innerHTML = '';
      const head = node('div', { class: 'page-head' },
        node('div', { class: 'page-head-copy' }, node('h1', { text: page.label }), node('p', { text: page.path })),
        node('label', { class: 'page-switch' }, 'Page enabled ', toggleControl(page.enabled !== false, checked => { page.enabled = checked; renderAll(); }))
      );
      content.appendChild(head);

      const groups = new Map();
      page.steps.forEach((step, index) => {
        const haystack = `${step.label} ${step.description || ''} ${step.group || ''}`.toLowerCase();
        if (state.query && !haystack.includes(state.query)) return;
        const group = step.group || 'Capture states';
        if (!groups.has(group)) groups.set(group, []);
        groups.get(group).push({ step, index });
      });

      if (!groups.size) { content.appendChild(node('div', { class: 'empty', text: 'No capture states match this filter.' })); return; }
      for (const [groupName, entries] of groups) {
        const section = node('section', { class: 'group' });
        const allOn = entries.every(({ step }) => step.enabled === true);
        const groupToggle = node('button', { class: 'group-toggle', text: allOn ? 'Disable group' : 'Enable group' });
        groupToggle.addEventListener('click', () => { entries.forEach(({ step }) => { step.enabled = !allOn; }); renderAll(); });
        section.appendChild(node('div', { class: 'group-head' }, node('h2', { text: groupName }), node('span', { class: 'group-line' }), groupToggle));
        const grid = node('div', { class: 'card-grid' });
        entries.forEach(({ step, index }) => grid.appendChild(renderStepCard(page, step, index)));
        section.appendChild(grid); content.appendChild(section);
      }
    }

    function renderStepCard(page, step, stepIndex) {
      const card = node('article', { class: `step-card${step.enabled === true ? '' : ' off'}` });
      const toggle = toggleControl(step.enabled === true, checked => { step.enabled = checked; renderAll(); });
      const mode = node('select', { class: 'mode', 'aria-label': 'Capture mode' });
      const modes = [['viewport','Viewport'],['fullPage','Full page']];
      if (step.selector || step.focusSelector) modes.push(['element','Element']);
      modes.forEach(([value,label]) => { const option = node('option', { value, text: label }); option.selected = (step.captureMode || 'viewport') === value; mode.appendChild(option); });
      mode.addEventListener('change', () => { step.captureMode = mode.value; renderPage(); updateSummary(); });
      card.appendChild(node('div', { class: 'step-head' }, toggle, node('div', { class: 'step-copy' }, node('h3', { text: step.label }), node('p', { text: step.description || '' })), mode));

      const options = node('div', { class: 'step-options' });
      if ((step.captureMode || 'viewport') === 'viewport') {
        ['desktop','mobile'].forEach(deviceName => {
          if (deviceName === 'mobile' && step.includeMobile === false) return;
          const dimensions = step[deviceName] || clone(state.config.devices[deviceName].viewport);
          step[deviceName] = dimensions;
          const row = node('div', { class: 'option-row' }, node('span', { class: 'option-label', text: deviceName === 'desktop' ? 'Desktop size' : 'Mobile size' }));
          const dim = node('div', { class: 'dims' });
          dim.append(miniNumber(dimensions.width, value => { dimensions.width = value; }), node('span', { text: '×' }), miniNumber(dimensions.height, value => { dimensions.height = value; }));
          row.appendChild(dim); options.appendChild(row);
        });
      }

      (step.actions || []).forEach(action => {
        if (!action.editable) return;
        const row = node('label', { class: 'option-row' }, node('span', { class: 'option-label', text: action.label || action.type }));
        let input;
        if (Array.isArray(action.options)) {
          input = node('select', { class: 'option-input' });
          action.options.forEach(value => { const option = node('option', { value, text: value }); option.selected = value === action.value; input.appendChild(option); });
        } else {
          input = node('input', { class: 'option-input', type: 'text', value: action.value ?? '' });
        }
        input.addEventListener('change', () => { action.value = input.value; });
        row.appendChild(input); options.appendChild(row);
      });
      if (options.children.length) card.appendChild(options);

      const footer = node('div', { class: 'card-footer' });
      if (!step.mobileOnly) {
        const mobile = node('input', { type: 'checkbox' }); mobile.checked = step.includeMobile !== false;
        mobile.disabled = state.config.devices.mobile.enabled === false;
        mobile.addEventListener('change', () => { step.includeMobile = mobile.checked; renderAll(); });
        footer.appendChild(node('label', { class: 'check-label' }, mobile, 'Include mobile'));
      } else footer.appendChild(node('span', { class: 'badge', text: 'Mobile only' }));
      if (step.waitFor || step.cleanupActions?.length) footer.appendChild(node('span', { class: 'badge', text: step.cleanupActions?.length ? 'Isolated state' : 'Waits for data' }));
      card.appendChild(footer);
      return card;
    }

    function applyPreset(name) {
      if (name === 'recommended') state.config = clone(state.defaults);
      if (name === 'essential') {
        state.config.pages.forEach(page => { page.enabled = true; page.steps.forEach(step => { step.enabled = ESSENTIAL_IDS.has(step.id); }); });
      }
      if (name === 'all') state.config.pages.forEach(page => { page.enabled = true; page.steps.forEach(step => { step.enabled = true; }); });
      if (name === 'clear') state.config.pages.forEach(page => page.steps.forEach(step => { step.enabled = false; }));
      renderAll();
    }

    function updateSummary() {
      const total = countCaptures();
      const button = document.getElementById('capture-button');
      button.textContent = `Capture · ${total}`;
      button.disabled = total === 0 || state.running;
    }

    function countCaptures() {
      let total = 0;
      state.config.pages.forEach(page => {
        if (page.enabled === false) return;
        page.steps.forEach(step => {
          if (step.enabled !== true) return;
          if (state.config.devices.desktop.enabled !== false && !step.mobileOnly) total += 1;
          if (state.config.devices.mobile.enabled !== false && !step.desktopOnly && step.includeMobile !== false) total += 1;
        });
      });
      return total;
    }

    async function startCapture() {
      const total = countCaptures();
      if (!total) return;
      state.running = true;
      state.jobId = crypto.randomUUID(); state.rendered = 0;
      showRunModal(total);
      updateSummary();
      try {
        const response = await fetch('/api/run', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jobId: state.jobId, siteId: state.siteId, config: state.config })
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        poll();
      } catch (error) { showRunError(error.message); }
    }

    async function poll() {
      try {
        const response = await fetch(`/api/status/${encodeURIComponent(state.jobId)}`);
        const job = await response.json();
        if (!response.ok) throw new Error(job.error || `HTTP ${response.status}`);
        if (job.lastLog) document.getElementById('run-status').textContent = job.lastLog;
        renderCaptures(job.entries || []);
        const total = job.total || countCaptures();
        const progress = total ? Math.min(100, Math.round((state.rendered / total) * 100)) : 0;
        document.getElementById('progress-fill').style.width = `${progress}%`;
        document.getElementById('progress-label').textContent = `${state.rendered} of ${total}`;
        if (job.status === 'done') return finishRun(total);
        if (job.status === 'error') return showRunError(job.error || 'Capture failed.');
        state.pollTimer = setTimeout(poll, 900);
      } catch (error) { showRunError(error.message); }
    }

    function renderCaptures(entries) {
      const list = document.getElementById('captures');
      if (state.rendered === 0 && entries.length) list.innerHTML = '';
      for (let index = state.rendered; index < entries.length; index += 1) {
        const entry = entries[index];
        list.appendChild(node('div', { class: 'capture-row' },
          node('img', { src: `/api/thumbnail/${encodeURIComponent(state.jobId)}/${entry.index}`, alt: '' }),
          node('strong', { text: entry.label })
        ));
        state.rendered += 1;
      }
      if (entries.length) list.scrollTop = list.scrollHeight;
    }

    function showRunModal(total) {
      stopPoll();
      document.getElementById('run-modal').classList.remove('hidden');
      document.getElementById('run-title').textContent = `Capturing ${state.site.name}`;
      document.getElementById('run-status').textContent = 'Starting Chromium…';
      document.getElementById('spinner').classList.remove('hidden');
      document.getElementById('progress-fill').style.width = '0%';
      document.getElementById('progress-label').textContent = `0 of ${total}`;
      document.getElementById('captures').innerHTML = '<div class="empty">Screenshots will appear here as they complete.</div>';
      document.getElementById('run-error').style.display = 'none';
      document.getElementById('download').style.display = 'none';
      document.getElementById('close-modal').style.display = 'none';
    }

    function finishRun(total) {
      stopPoll();
      state.running = false;
      document.getElementById('spinner').classList.add('hidden');
      document.getElementById('run-title').textContent = 'Capture complete';
      document.getElementById('run-status').textContent = 'ZIP archive is ready.';
      document.getElementById('progress-fill').style.width = '100%';
      document.getElementById('progress-label').textContent = `${state.rendered} of ${total}`;
      const download = document.getElementById('download'); download.href = `/api/download/${encodeURIComponent(state.jobId)}`; download.style.display = 'block';
      document.getElementById('close-modal').style.display = 'block';
      updateSummary();
    }

    function showRunError(message) {
      stopPoll();
      state.running = false;
      document.getElementById('spinner').classList.add('hidden');
      document.getElementById('run-title').textContent = 'Capture stopped';
      document.getElementById('run-status').textContent = 'Review the error and try again.';
      const error = document.getElementById('run-error'); error.textContent = message; error.style.display = 'block';
      document.getElementById('close-modal').style.display = 'block';
      updateSummary();
    }

    function closeModal() { if (!state.pollTimer) document.getElementById('run-modal').classList.add('hidden'); }
    function stopPoll() { if (state.pollTimer) clearTimeout(state.pollTimer); state.pollTimer = null; }

    function enabledOnPage(page) { return page.steps.filter(step => step.enabled === true).length; }
    function miniNumber(value, onChange) {
      const input = node('input', { class: 'mini-input', type: 'number', min: '320', max: '3840', value });
      input.addEventListener('change', () => { const next = Math.max(320, Math.min(3840, Number(input.value) || Number(value))); input.value = next; onChange(next); });
      return input;
    }
    function toggleControl(checked, onChange) {
      const input = node('input', { type: 'checkbox' }); input.checked = checked;
      input.addEventListener('change', () => onChange(input.checked));
      return node('label', { class: 'toggle' }, input, node('span'));
    }
    function node(tag, attributes = {}, ...children) {
      const element = document.createElement(tag);
      Object.entries(attributes).forEach(([key, value]) => {
        if (key === 'class') element.className = value;
        else if (key === 'text') element.textContent = value;
        else if (value != null) element.setAttribute(key, value);
      });
      children.flat().forEach(child => { if (child != null) element.appendChild(child instanceof Node ? child : document.createTextNode(String(child))); });
      return element;
    }
    function clone(value) { return JSON.parse(JSON.stringify(value)); }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character])); }
    boot();
  </script>
</body>
</html>
