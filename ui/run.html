<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SiteSnap · Configure capture</title>
  <link rel="stylesheet" href="/styles/run.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="13" rx="2" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="11.5" r="3" fill="currentColor"/></svg></span>
      <strong>SiteSnap</strong>
    </a>
    <span class="top-divider"></span>
    <div class="project-title"><strong id="project-name">Loading…</strong><span id="project-note">Local capture configuration</span></div>
    <span class="capture-summary" id="capture-summary">0 outputs</span>
    <button class="capture-button" id="capture-button" type="button" disabled>Capture · 0</button>
  </header>

  <div class="app">
    <aside class="sidebar" id="sidebar"><div class="skeleton"></div></aside>
    <section class="workspace">
      <div class="runtime-banner hidden" id="runtime-banner">
        <div class="runtime-copy"><strong id="runtime-title">Hosted capture ready</strong><span id="runtime-message"></span></div>
      </div>
      <div class="controls">
        <select class="mobile-page-select" id="mobile-page-select" aria-label="Capture page"></select>
        <div class="preset-row">
          <button class="preset primary" type="button" data-preset="recommended">Recommended</button>
          <button class="preset" type="button" data-preset="essential">Essential only</button>
          <button class="preset" type="button" data-preset="all">All states</button>
          <button class="preset" type="button" data-preset="clear">Clear</button>
          <input class="search" id="search" type="search" aria-label="Filter capture states" placeholder="Filter capture states…">
        </div>
        <div class="device-row" id="device-row"></div>
      </div>
      <main class="content" id="content"><div class="skeleton"></div><div class="skeleton skeleton-spaced"></div></main>
    </section>
  </div>

  <div class="modal hidden" id="run-modal" role="dialog" aria-modal="true" aria-labelledby="run-title" aria-describedby="run-status">
    <section class="run-panel" id="run-panel" tabindex="-1">
      <div class="run-head"><div class="spinner" id="spinner"></div><div class="run-copy"><strong id="run-title">Capturing Nuveen</strong><span id="run-status" aria-live="polite">Starting Chromium…</span></div></div>
      <div class="progress" id="progress"><div id="progress-fill"></div></div>
      <div class="run-meta"><span id="progress-label">0 of 0</span><span id="run-mode-label">Isolated browser contexts</span></div>
      <div class="run-error" id="run-error"></div>
      <div class="captures" id="captures"><div class="empty">Screenshots will appear here as they complete.</div></div>
      <div class="run-actions"><a class="run-action download" id="download" href="#">Download ZIP</a><button class="run-action close" id="close-modal" type="button">Close</button></div>
    </section>
  </div>

  <script type="module" src="/scripts/run.js"></script>
</body>
</html>
